set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g set-clipboard on

# Ghostty has a known bug where DEC 2026 synchronized-output escapes wrapping
# tmux's incremental, cursor-positioned status-line redraws (e.g. every
# keystroke during rename-window) progressively corrupt the display, leaving
# old and new status-bar text meshed together. No Ghostty-side fix exists yet
# (https://github.com/ghostty-org/ghostty/discussions/12062), so stop tmux
# from emitting the Sync capability at all.
set -as terminal-overrides '*:Sync@'

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Grouped sessions (e.g. mirroring a session to an iPad) default to
# window-size "latest", which resizes shared windows to whichever client
# was most recently active. Switching to the desktop client after the iPad
# was "latest" forces a resize right as a zoomed mode (e.g. prefix+s
# choose-tree -Z) spawns, and tmux fails to redraw the newly-exposed area,
# leaving it blank until you interact. Pinning to "largest" keeps shared
# windows at a stable size so opening choose-tree doesn't race a resize.
set -g window-size largest

# image.nvim
set -gq allow-passthrough on
set -g visual-activity off

# pi agent
set -g extended-keys on

set-option -g status-position top

set -g set-titles on
set -g set-titles-string "#S:#W"

set -g base-index 1
setw -g pane-base-index 1

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind -N "Split pane horizontally" '\' split-window -h
unbind '"'
bind -N "Split pane vertically" - split-window -v

unbind r
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded...";


bind -r -N "Resize pane down" j resize-pane -D 5
bind -r -N "Resize pane up" k resize-pane -U 5
bind -r -N "Resize pane right" l resize-pane -R 5
bind -r -N "Resize pane left" h resize-pane -L 5

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
} {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

##### Display Popups #####

# Let popups (lazygit, ranger, sessionx, etc.) show through to the terminal's
# own background instead of tmux's opaque default, so terminal transparency
# (e.g. Ghostty background-opacity) shows through. catppuccin_tmux.conf sets
# popup-style to opaque theme colors, so the real (survives flavor switches)
# override lives in plugins/catppuccin_set_{latte,frappe}.conf, right after
# their final catppuccin_tmux.conf source. This copy just covers the brief
# window before that file loads.
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=default,bg=default'

bind -N "Open lazygit popup" C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind -N "Create and switch to new named session" C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
# Popup instead of the inline status-bar prompt: avoids the Ghostty
# synchronized-output redraw bug triggered by rename-window's live status-bar
# editing (see terminal-overrides Sync@ note above).
unbind ,
bind -N "Rename window (popup)" , display-popup \
  -w 40 -h 3 \
  -E 'bash -i -c "read -e -i \"$(tmux display-message -p \"#W\")\" -p \"Rename window to: \" name; tmux rename-window -- \"\$name\""'
bind -N "Fuzzy-switch session" C-f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind -N "Open ipython popup" C-p display-popup -E "ipython"
bind -N "Open ranger popup" C-e display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "ranger"
bind -N "Edit zshrc" C-z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim --cmd "set background=$(defaults read -g AppleInterfaceStyle >/dev/null 2>&1 && echo dark || echo light)" ~/.zshrc'
bind -N "Open shell popup" C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
bind -N "Command palette" Space display-popup -w 70% -h 60% -E "~/.config/tmux/scripts/palette.sh"


##### Dotfiles Editor #####

bind -N "Edit dotfiles (fuzzy find)" m display-popup -d "~/dotfiles" -w 90% -h 85% -E "~/.config/tmux/scripts/config-edit.sh"


unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'


# list of tmux plugins
set -g @plugin 'aserowy/tmux.nvim'           # nvim-tmux navigation

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -n 'C-n' if-shell "$is_vim" 'send-keys C-n' { if -F '#{window_end_flag}' '' 'select-window -n' }
bind-key -n 'C-p' if-shell "$is_vim" 'send-keys C-p' { if 'test #{window_index} -gt #{base-index}' 'select-window -p' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'C-n' if -F '#{window_end_flag}' '' 'select-window -n'
bind-key -T copy-mode-vi 'C-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'erikw/tmux-dark-notify'
set -g @plugin 'b0o/tmux-autoreload'
# set -g @plugin 'samleeney/tmux-agent-status' # disabled: replaced by tmux-agent-sidebar
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @sidebar_width 20%
set -g @sidebar_key_all A # prefix + A: toggle sidebar on every window
set -g @sidebar_key a # prefix + a: toggle sidebar on current window only

bind-key -T prefix s choose-tree -Zs

set-option -g @tmux-autoreload-configs '~/.config/tmux/tmux.conf'

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# tmux-agent-sidebar panes are invisible to resurrect (it only saves built-in
# pane formats, never @pane_role), so they come back as plain shells and the
# plugin splits a second sidebar next to each ghost. These hooks tag the
# sidebar panes on save and turn them back into real sidebars on restore --
# see scripts/resurrect-sidebar.sh for the details.
set -g @resurrect-hook-post-save-layout '$HOME/.config/tmux/scripts/resurrect-sidebar.sh save'
set -g @resurrect-hook-pre-restore-all '$HOME/.config/tmux/scripts/resurrect-sidebar.sh pre-restore'
set -g @resurrect-hook-post-restore-all '$HOME/.config/tmux/scripts/resurrect-sidebar.sh post-restore'

# Catppuccin theme settings (v2.3.0 -- window/status style options live in
# the catppuccin_set_*.conf flavor files, not here: @catppuccin_reset wipes
# them, so they must be re-applied and the plugin re-run in the same file
# that resets it. See docs/tutorials/03-resetting-theme.md.)
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Sets @catppuccin_flavor, runs catppuccin.tmux, and seeds tmux-agent-sidebar's
# @sidebar_color_* options — the same logic tmux-dark-notify re-runs (through
# catppuccin_set_latte.conf's wait-for-locked wrapper) on a light/dark flip
# (see @dark-notify-theme-path-* below), so this is just the startup-time
# baseline before that async check resolves.
#
# Sources catppuccin_apply_latte.conf directly rather than going through
# catppuccin_set_latte.conf's wait-for lock: this runs before any client is
# attached, and `wait-for -L` requires a connected client to work at all, so
# a client-less caller here can't actually take that lock. It used to source
# the locked wrapper anyway, which meant this call silently failed to lock
# and raced tmux-dark-notify's startup callback (which fires almost
# immediately, on the current appearance, uncontested) -- corrupting the
# wait-for channel itself and printing "not able to lock" / "channel ...
# not locked" on every cold start, before tmux-continuum's restore message.
source-file ~/.config/tmux/plugins/catppuccin_apply_latte.conf

set -g @catppuccin_directory_text "#{pane_current_path}"

# Custom module (aggregate agent-status summary) -- v2 dropped
# @catppuccin_custom_plugin_dir/status_modules_left/right, so this is now just
# a literal status-right value instead of a registered "module". Placed ahead
# of the session/user/host modules so it sits to their left.
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#($HOME/.config/tmux/scripts/agent-status-summary.sh) #{E:@catppuccin_status_session}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"


# set theme according to system
set -g @dark-notify-theme-path-light '~/.config/tmux/plugins/catppuccin_set_latte.conf'
set -g @dark-notify-theme-path-dark '~/.config/tmux/plugins/catppuccin_set_frappe.conf'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# TPM's run above re-invokes catppuccin/tmux's own init directly (not through
# our catppuccin_set_*.conf wrapper), which re-clobbers popup-style/
# popup-border-style back to opaque theme colors on every full tmux.conf
# reload. Reassert transparency last so it wins.
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=default,bg=default'

