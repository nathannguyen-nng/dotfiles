set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_reset 'true'
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# tmux-agent-sidebar colors (Catppuccin Frappe)
# Note: the sidebar is a long-running process that only reads these once at
# startup, so an already-open sidebar needs toggling off/on (prefix+e twice,
# or prefix+E twice) to pick up a flavor change.
set -g @sidebar_color_accent "#8caaee"
set -g @sidebar_color_border "#626880"
set -g @sidebar_color_all "#99d1db"
set -g @sidebar_color_running "#e5c890"
set -g @sidebar_color_waiting "#ef9f76"
set -g @sidebar_color_idle "#737994"
set -g @sidebar_color_error "#e78284"
set -g @sidebar_color_filter_inactive "#737994"
set -g @sidebar_color_agent_claude "#f2d5cf"
set -g @sidebar_color_agent_codex "#ca9ee6"
set -g @sidebar_color_agent_opencode "#81c8be"
set -g @sidebar_color_pet_body "#ef9f76"
set -g @sidebar_color_pet_eye "#303446"
set -g @sidebar_color_text_active "#c6d0f5"
set -g @sidebar_color_text_muted "#a5adce"
set -g @sidebar_color_text_inactive "#737994"
set -g @sidebar_color_session "#babbf1"
set -g @sidebar_color_port "#b5bfe2"
set -g @sidebar_color_wait_reason "#ef9f76"
set -g @sidebar_color_selection "#51576d"
set -g @sidebar_color_branch "#a6d189"
set -g @sidebar_color_task_progress "#81c8be"
set -g @sidebar_color_subagent "#ca9ee6"
set -g @sidebar_color_commit_hash "#e5c890"
set -g @sidebar_color_diff_added "#a6d189"
set -g @sidebar_color_diff_deleted "#e78284"
set -g @sidebar_color_file_change "#e5c890"
set -g @sidebar_color_pr_link "#8caaee"
set -g @sidebar_color_section_title "#babbf1"
set -g @sidebar_color_activity_timestamp "#a5adce"
set -g @sidebar_color_response_arrow "#85c1dc"
