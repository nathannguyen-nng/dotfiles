# Serialize the whole flavor switch against any other client applying a flavor
# at the same time. tmux-dark-notify runs its callback per appearance change,
# so two toggles in quick succession put two `tmux source-file` clients into
# the server at once -- and tmux interleaves them: source-file yields the
# command queue whenever it descends into a nested file, and catppuccin's
# reload is ~15 nested files deep. Interleaved, one invocation's @thm_* palette
# gets paired with the other's module colors, which are frozen on first write
# by `-o`/`-F` (see catppuccin-full-reset.conf) and therefore stay wrong until
# the next switch -- the unreadable "dark text on a light pill" symptom.
# `wait-for -L` blocks the *client*, not the server, so a second switch simply
# queues behind this one and then applies cleanly on top of a settled state.
# Every exit path from this file must hit the matching `wait-for -U` at the
# bottom, or later switches will block forever.
#
# This lock only guards real clients (tmux-dark-notify's callback, manual
# reloads via this file) against each other. tmux.conf's own startup
# application runs before any client is attached -- `wait-for -L` requires a
# connected client to work at all, so a client-less caller can't take this
# lock. See catppuccin_set_latte.conf for the "not able to lock" history this
# avoids; tmux.conf sources catppuccin_apply_latte.conf directly at startup,
# bypassing this lock (and this file) entirely.
wait-for -L catppuccin_flavor_switch
source-file ~/.config/tmux/plugins/catppuccin_apply_frappe.conf
wait-for -U catppuccin_flavor_switch
