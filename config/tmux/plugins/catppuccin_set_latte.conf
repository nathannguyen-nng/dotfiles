set -g @catppuccin_flavor 'latte'
set -g @catppuccin_reset 'true'
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# tmux-agent-sidebar colors (Catppuccin Latte)
# Note: the sidebar is a long-running process that only reads these once at
# startup, so an already-open sidebar needs toggling off/on (prefix+e twice,
# or prefix+E twice) to pick up a flavor change.
set -g @sidebar_color_accent "#1e66f5"
set -g @sidebar_color_border "#acb0be"
set -g @sidebar_color_all "#04a5e5"
set -g @sidebar_color_running "#df8e1d"
set -g @sidebar_color_waiting "#fe640b"
set -g @sidebar_color_idle "#9ca0b0"
set -g @sidebar_color_error "#d20f39"
set -g @sidebar_color_filter_inactive "#9ca0b0"
set -g @sidebar_color_agent_claude "#dc8a78"
set -g @sidebar_color_agent_codex "#8839ef"
set -g @sidebar_color_agent_opencode "#179299"
set -g @sidebar_color_pet_body "#fe640b"
set -g @sidebar_color_pet_eye "#eff1f5"
set -g @sidebar_color_text_active "#4c4f69"
set -g @sidebar_color_text_muted "#6c6f85"
set -g @sidebar_color_text_inactive "#9ca0b0"
set -g @sidebar_color_session "#7287fd"
set -g @sidebar_color_port "#5c5f77"
set -g @sidebar_color_wait_reason "#fe640b"
set -g @sidebar_color_selection "#bcc0cc"
set -g @sidebar_color_branch "#40a02b"
set -g @sidebar_color_task_progress "#179299"
set -g @sidebar_color_subagent "#8839ef"
set -g @sidebar_color_commit_hash "#df8e1d"
set -g @sidebar_color_diff_added "#40a02b"
set -g @sidebar_color_diff_deleted "#d20f39"
set -g @sidebar_color_file_change "#df8e1d"
set -g @sidebar_color_pr_link "#1e66f5"
set -g @sidebar_color_section_title "#7287fd"
set -g @sidebar_color_activity_timestamp "#6c6f85"
set -g @sidebar_color_response_arrow "#209fb5"
