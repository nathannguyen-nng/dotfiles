# vim:set ft=tmux:
#
# Generated list of the per-module options that catppuccin/tmux's
# status_module.conf and status/*.conf set with the "F" flag
# (set -ogqF / set -gqF), which expands a #{...} reference to a
# literal value immediately instead of keeping it as a live format
# string. icon_fg/text_fg are "-o" (only if unset) so they simply
# never move again once set; icon_bg is guarded by its own %if empty
# check in status_module.conf, so resetting the module's _color alone
# is not enough -- icon_bg must be unset too or the %if sees it's
# already populated and skips recomputing it. Combined, these never
# move again once set -- see catppuccin_set_frappe.conf (and the
# latte/mocha siblings) for why this needs unsetting before every
# flavor switch.
# Deliberately narrow: module icon/text customizations and
# window/pane/separator options are left alone, since some of those
# are set once in tmux.conf and would otherwise be wiped on every
# flavor switch instead of just at startup.
set -Ugq @catppuccin_status_application_icon_fg
set -Ugq @catppuccin_status_application_text_fg
set -Ugq @catppuccin_status_application_icon_bg
set -Ugq @catppuccin_application_color
