# macOS fires AppleInterfaceThemeChangedNotification several times per actual
# appearance toggle (a known quirk, not a bug in tmux-dark-notify), so its
# callback -- and thus a `tmux source-file` of this same flavor -- can land
# a dozen-plus times back to back. catppuccin_set_mocha.conf's wait-for lock
# serializes concurrent applications so each one runs to completion instead of
# racing; skip the whole rebuild here when already on this flavor so repeats
# are a near-instant no-op instead of a full ~15-file resource + redraw.
%if "#{!=:#{@catppuccin_flavor},mocha}"

# Full reset before switching flavor -- @catppuccin_reset alone misses several
# module options (session/user/host module colors among them) that get baked
# in permanently on first use; see catppuccin-full-reset.conf.
#
# The plugin is invoked with source-file rather than
# `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`. That script is just a
# two-line wrapper around `tmux source catppuccin_options_tmux.conf` +
# `tmux source catppuccin_tmux.conf` (`source` is an alias for `source-file`,
# see `tmux list-commands`), so sourcing them directly is equivalent. It is
# also cheaper and less interruptible: `run` forks a shell, parks this file's
# command queue until it exits, and lets the server service other clients for
# the whole of that much wider window -- it widened the interleaving window
# above from ~40ms to "always" in testing. The wait-for lock is what actually
# makes the switch safe; this just keeps the critical section short.
#
# catppuccin_tmux.conf is sourced only once below (after the window/status
# overrides), not here right after the options pass -- catppuccin_reset's
# options pass unsets itself once consumed (catppuccin_options_tmux.conf's
# `set -Ug @catppuccin_reset`), so a first build here would just get thrown
# away and rebuilt by the second pass anyway. Each pass through
# catppuccin_tmux.conf recursively sources ~17 files; during tmux's
# client-less startup parse those nested source-file calls share one
# never-decrementing counter (capped at 50) with everything else tmux.conf
# sources, so a redundant extra pass here reliably overflowed it and printed
# "too many nested files" on every cold start.
source-file ~/.config/tmux/plugins/catppuccin-full-reset.conf
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_reset 'true'
source-file ~/.config/tmux/plugins/tmux/catppuccin_options_tmux.conf

# catppuccin/tmux v2's @catppuccin_reset unsets window/status styling options
# (not just colours) as a side effect of reloading, so our custom separators and
# window style must be re-applied and the plugin re-sourced to rebuild the
# window/status formats with them. See docs/tutorials/03-resetting-theme.md.
#
# v2's "custom" window style also inserts separator glyphs without wrapping them
# in their own #[fg=...,bg=...] -- they inherit whatever colour was active from
# the preceding segment, so a plain block renders in the wrong colour instead of
# transitioning between segments (catppuccin/tmux#403). Give each one explicit
# colours; left_separator additionally has to re-assert the number pill's fill
# style, because the template puts #I directly after it with nothing in between.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_number_color},bg=default]█#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]█ "
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_text_color},bg=default]█"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default]█#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]█ "
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]█"
# The right_separator block of one window and the left_separator block of the
# next already sit flush; tmux's default window-status-separator (a space)
# adds an extra gap between tabs on top of that.
set -g window-status-separator ""
# Window text defaults to the raw pane title (#T), which z4h's shell
# integration sets to the cwd -- long paths blow out the status bar, and
# automatic-rename/pane_current_command alone can't tell us an agent CLI is
# running (Claude Code backgrounds its real work behind the interactive shell,
# so pane_current_command just reports "zsh"). tmux-agent-sidebar's hooks set
# @pane_agent/@pane_status on the pane for exactly this reason -- when an
# agent is running, prefix its name with a state icon (bolt=running,
# pause=waiting, check=idle, x=error), matching agent-status-summary.sh's
# icons/colors on the status line. Otherwise fall back to pane_current_command
# (covers nvim etc.) and finally to the innermost directory for plain shells.
set -g @catppuccin_window_text ' #{?#{@pane_agent},#{?#{==:#{@pane_status},waiting},#[fg=#{@thm_sky}],#{?#{==:#{@pane_status},error},#[fg=#{@thm_red}],#{?#{==:#{@pane_status},idle},#[fg=#{@thm_green}],#[fg=#{@thm_yellow}]}}} #[fg=#{@thm_fg}]#[bg=#{E:@catppuccin_window_text_color}]#{@pane_agent},#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}'
set -g @catppuccin_window_current_text ' #{?#{@pane_agent},#{?#{==:#{@pane_status},waiting},#[fg=#{@thm_sky}],#{?#{==:#{@pane_status},error},#[fg=#{@thm_red}],#{?#{==:#{@pane_status},idle},#[fg=#{@thm_green}],#[fg=#{@thm_yellow}]}}} #[fg=#{@thm_fg}]#[bg=#{E:@catppuccin_window_current_text_color}]#{@pane_agent},#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}'
# Powerline rounded pill caps (U+E0B6 / U+E0B4). The template wraps these in
# #[fg=module_color,bg=default] and #[fg=text_bg,bg=default], so they draw the
# module-coloured cap before the icon and the grey cap after the text. These PUA
# glyphs are easy to lose when editing -- if the caps vanish, check these first.
set -g @catppuccin_status_left_separator " "
# The middle separator sits between the icon (fg=crust,bg=module_color) and the
# text with no fg of its own, so a plain block fills with crust rather than the
# module colour. One value is shared by every module, so we can't hardcode a
# colour: #[reverse] swaps fg/bg first so the block picks up module_color.
set -g @catppuccin_status_middle_separator "#[reverse]█#[noreverse]"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
source-file ~/.config/tmux/plugins/tmux/catppuccin_options_tmux.conf
source-file ~/.config/tmux/plugins/tmux/catppuccin_tmux.conf

# tmux-agent-sidebar colors (Catppuccin Mocha)
# Note: the sidebar is a long-running process that only reads these once at
# startup, so an already-open sidebar needs toggling off/on (prefix+e twice,
# or prefix+E twice) to pick up a flavor change.
set -g @sidebar_color_accent "#89b4fa"
set -g @sidebar_color_border "#585b70"
set -g @sidebar_color_all "#89dceb"
set -g @sidebar_color_running "#f9e2af"
set -g @sidebar_color_waiting "#fab387"
set -g @sidebar_color_idle "#6c7086"
set -g @sidebar_color_error "#f38ba8"
set -g @sidebar_color_filter_inactive "#6c7086"
set -g @sidebar_color_agent_claude "#f5e0dc"
set -g @sidebar_color_agent_codex "#cba6f7"
set -g @sidebar_color_agent_opencode "#94e2d5"
set -g @sidebar_color_pet_body "#fab387"
set -g @sidebar_color_pet_eye "#1e1e2e"
set -g @sidebar_color_text_active "#cdd6f4"
set -g @sidebar_color_text_muted "#a6adc8"
set -g @sidebar_color_text_inactive "#6c7086"
set -g @sidebar_color_session "#b4befe"
set -g @sidebar_color_port "#bac2de"
set -g @sidebar_color_wait_reason "#fab387"
set -g @sidebar_color_selection "#45475a"
set -g @sidebar_color_branch "#a6e3a1"
set -g @sidebar_color_task_progress "#94e2d5"
set -g @sidebar_color_subagent "#cba6f7"
set -g @sidebar_color_commit_hash "#f9e2af"
set -g @sidebar_color_diff_added "#a6e3a1"
set -g @sidebar_color_diff_deleted "#f38ba8"
set -g @sidebar_color_file_change "#f9e2af"
set -g @sidebar_color_pr_link "#89b4fa"
